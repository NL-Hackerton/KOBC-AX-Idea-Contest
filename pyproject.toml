[project]
name = "kjit"
version = "0.1.0"
description = "K-JIT: 항만 선석 가용 확률 예측 기반 적시 도착(JIT) 권고 프로토타입"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.9.1",
    "fastapi>=0.142.4",
    "uvicorn>=0.54.0",
    "apscheduler>=3.11.3",
    "anthropic>=1.12.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
